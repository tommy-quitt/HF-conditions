name: Collect and deploy

# SPEC.md §7.2 ("poll every ~10-15 minutes"), adapted per DEVIATIONS.md: no
# persistent collector process is possible on GitHub Actions, so this runs
# scripts/collect.ts on a schedule instead. Also builds apps/web with the
# freshly collected data baked in and deploys it to GitHub Pages, so every
# run both refreshes the evidence and republishes the site.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # SPEC.md §7.4 ("cluster configuration must be externalized") and
  # AGENTS.md ("hostnames/ports are configuration, not hardcoded") apply
  # equally to the fixed home QTH and RBN login callsign this project's
  # adapters need - keep them here, not hardcoded in scripts/collect.ts.
  HF_HOME_GRID: ${{ vars.HF_HOME_GRID || 'KM72' }}
  HF_CONTACT_EMAIL: ${{ vars.HF_CONTACT_EMAIL }}
  HF_RBN_CALLSIGN: ${{ secrets.HF_RBN_CALLSIGN }}

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DEVIATIONS.md: the committed JSON store lives on a dedicated `data`
      # branch, not `main`. Bring its current contents in before collecting,
      # so scripts/collect.ts (SPEC.md §26) can fall back to "last known
      # value, marked stale" instead of starting from nothing every run.
      - name: Checkout data branch
        id: checkout_data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data-branch

      - name: Initialize data branch if it doesn't exist yet
        if: steps.checkout_data.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The failed "Checkout data branch" step above can still leave a
          # partially-initialized repo here (e.g. a remote named "origin"
          # already added before the fetch of a nonexistent `data` ref
          # failed) - wipe it first so this is idempotent regardless of what
          # that step left behind.
          rm -rf data-branch
          mkdir -p data-branch
          cd data-branch
          git init -q
          git checkout -q -b data
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git commit -q --allow-empty -m "Initialize data branch"

      - name: Seed collector input from the data branch
        run: |
          mkdir -p data
          for f in solar.json aggregates.json health.json; do
            if [ -f "data-branch/$f" ]; then cp "data-branch/$f" "data/$f"; fi
          done

      - name: Collect
        run: npm run collect

      - name: Sync data into the web app for build
        run: npm run sync-data

      - name: Build web app
        run: npm run build --workspace apps/web

      - name: Commit updated data to the data branch
        run: |
          for f in solar.json aggregates.json health.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "data-branch/$f"; fi
          done
          cd data-branch
          git add solar.json aggregates.json health.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git -c user.email="actions@github.com" -c user.name="github-actions[bot]" commit -q -m "Update collected data"
            git push origin data
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
